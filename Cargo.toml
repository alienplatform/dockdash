[package]
name = "dockdash"
version = "0.1.1"
edition = "2021"
authors = ["Alien <hello@alien.dev>"]
description = "Build and push OCI container images without Docker"
license = "Apache-2.0"
repository = "https://github.com/alienplatform/dockdash"
homepage = "https://github.com/alienplatform/dockdash"
keywords = ["docker", "oci", "container", "image", "buildkit"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[dependencies]
oci-spec = "0.6.7"
tar = "0.4"
sha2 = "0.10"
serde_json = "1.0"
ocipkg = "0.3.9"
tempfile = "3.10"
oci-tar-builder = "0.4"
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
dirs = "6"
thiserror = "2.0"
cacache = { version = "13.1", default-features = false, features = ["tokio-runtime", "mmap"] }
container-registry = { version = "0.3", features = ["test-support"], optional = true }
async-trait = "0.1"
zstd = "0.13"
flate2 = "1"
walkdir = "2"

[dev-dependencies]
bollard = "0.18"
futures-util = "0.3"
rand = "0.9"
rand_distr = "0.5"
sec = "1"
container-registry = { version = "0.3", features = ["test-support"] }
dotenvy = "0.15"
tracing-test = "0.2"
tracing-subscriber = "0.3"
tokio = { version = "1.48", features = ["full", "test-util"] }

[features]
default = []
test-utils = ["dep:container-registry"]
